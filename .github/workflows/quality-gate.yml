name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, data audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Route regression tests
        run: npm run test:routes

      - name: Validate learning content and relationships
        run: npm run data:validate

      - name: Font coverage (every data glyph has a woff2 chunk)
        run: npm run fonts:check

      - name: Service worker contract (install / activate / warm)
        run: npm run test:sw

      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # `--with-deps` нь зөвхөн CI хост дээр (root байгаа); төгсгөл хэрэглэгч
      # дээр зөвхөн `npx playwright install chromium` эсвэл системийн Chrome.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Offline / update / storage / guest-merge / import-undo
        run: npm run test:e2e
